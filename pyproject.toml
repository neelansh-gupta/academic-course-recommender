[project]
name = "bitsrec"
version = "0.1.0"
description = "BITS Academic Course Recommender — structured ingestion and recommendation."
requires-python = ">=3.11"
dependencies = ["pymupdf>=1.24.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
bitsrec-ingest = "bitsrec.ingest.run:main"
bitsrec-dashboard = "bitsrec.dashboard.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
